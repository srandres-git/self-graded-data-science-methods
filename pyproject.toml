[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfgrade"
version = "0.1.0"
description = "Runtime for the self-graded data science methods notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "ipykernel>=6",
    "nbformat>=5",
]

[project.optional-dependencies]
jupyter = ["notebook>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["selfgrade*"]
